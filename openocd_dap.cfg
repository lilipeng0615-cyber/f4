# CMSIS-DAP (DAPLink) + SWD，对应 launch.json 的 "DAPlink" / "DAP-attach"

source [find interface/cmsis-dap.cfg]

# xpack OpenOCD 0.12 默认可能走 libusb bulk 后端，山寨 DAPLink 的 bulk 实现在枚举阶段
# 常报 "error submitting USB write: Input/Output Error"，切回 HID 稳得多。
# 若这行报 unknown command（老版本语法），换成：cmsis_dap_backend hid
cmsis-dap backend hid

# 默认 1~2MHz 在杜邦线稍长、接触稍差时直接 LIBUSB_ERROR_IO，先降到 500kHz 求连上
adapter speed 500

transport select swd

source [find target/stm32f4x.cfg]

# 复位下连接：目标固件若占了 PA13/PA14 或进了低功耗，只有拉 NRST 那一瞬间才抓得住。
# DAPLink 的 nRESET 必须接到板子 NRST 才有效，没接这根线的话本行无害也无用。
# 必须写在 source target 之后，否则会被 stm32f4x.cfg 自带的 reset_config 覆盖。
reset_config srst_only srst_nogate connect_assert_srst
